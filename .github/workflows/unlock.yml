name: Xiaomi Unlock Bot

on:
  schedule:
    # 17:59:50 UTC to 19:59:50 CEST
    - cron: '59 17 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj potrzebne biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 ntplib

      - name: Uruchom skrypt bota
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: python bot.py
